<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/styyyle.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #unity-container { position: fixed; inset: 0; width: 100%; height: 100%; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #000; touch-action: none; }
    #loading-cover { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; background: #000; }
    #unity-loading-bar { width: min(80vw, 420px); text-align: center; }
    #unity-logo img { max-width: 180px; max-height: 120px; object-fit: contain; }
    #unity-progress-bar-empty { width: 100%; height: 8px; margin-top: 22px; background: #333; }
    #unity-progress-bar-full { width: 0; height: 100%; background: #fff; }
    #fullscreen { position: fixed; z-index: 6; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); padding: 9px 13px; border: 1px solid #777; border-radius: 3px; background: #222; color: #fff; font: 14px Arial, sans-serif; opacity: .85; }
    #fullscreen:active { background: #444; }
    :fullscreen #fullscreen { display: none; }
  </style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="https://ragdollarchers2.io/data/image/game/ragdoll-archers.png" alt=""></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
  </div>
  <button id="fullscreen" type="button">Fullscreen</button>
  <script src="https://cdn.jsdelivr.net/gh/laparda14/Ragdoll-archers@62504c9570ea720c6367e7debe1e110c68f77c2d/vs/gameloader-helper.js"></script>
  <script>
    const loaderUrl = "https://cdn.jsdelivr.net/gh/bubbls/ruffle@7117cc5006472d782b65d96abd375597d6273242/v11121212.js";
    const config = {
      dataUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
      frameworkUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
      codeUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ericetto",
      productName: "Ragdoll Archers",
      productVersion: "0.1"
    };
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(() => {
        loadingCover.style.display = "none";
      }).catch((error) => {
        loadingCover.textContent = "Game failed to load. Please refresh and try again.";
        console.error(error);
      });
    };
    unityLoader.onerror = () => {
      loadingCover.textContent = "Game failed to load. Please refresh and try again.";
    };
    document.body.appendChild(unityLoader);
    document.getElementById("fullscreen").addEventListener("click", async () => {
      try {
        if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
      } catch (_) {}
    });
  </script>
</body>
</html>
