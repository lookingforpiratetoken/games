  <link rel="stylesheet" href="style.css">
  <style>
    .player-page{min-height:100vh;padding:0 22px 48px}

    .player-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
    .player-actions a{color:#fff;text-decoration:none;border:1px solid #ffffff26;border-radius:10px;padding:11px 16px}
    @media(max-width:600px){.player-page{padding:0 12px 32px}.player-shell{margin-top:34px}.player-frame{padding:5px;border-radius:12px}.player-frame iframe{height:65vh;min-height:360px}.player-heading{align-items:start;flex-direction:column}}
