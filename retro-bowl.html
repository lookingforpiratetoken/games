<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Retro Bowl</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
    #fullscreen {
      position: fixed; z-index: 10; top: 10px; right: 10px;
      padding: 9px 13px; color: #fff; background: #171717;
      border: 1px solid #666; border-radius: 3px;
      font: 14px Arial, sans-serif; cursor: pointer;
    }
    #fullscreen:active { background: #333; }
  </style>
</head>
<body>
  <iframe id="game"
    src="https://raw.githack.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/retro-bowl.html"
    title="Retro Bowl" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
  <button id="fullscreen" type="button">Fullscreen</button>
  <script>
    const game = document.getElementById('game');
    document.getElementById('fullscreen').addEventListener('click', () => {
      if (game.requestFullscreen) game.requestFullscreen();
      else if (game.webkitRequestFullscreen) game.webkitRequestFullscreen();
    });
  </script>
</body>
</html>
