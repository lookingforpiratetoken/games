<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title></title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
    main{display:flex;flex-direction:column;align-items:center;gap:54px}
    .atom{position:relative;width:190px;height:190px}
    .nucleus{position:absolute;width:22px;height:22px;border-radius:50%;background:#ddd;left:84px;top:84px;box-shadow:0 0 22px #aaa}
    .orbit{position:absolute;inset:27px 0;border:1px solid #777;border-radius:50%}
    .orbit.one{transform:rotate(0deg)}
    .orbit.two{transform:rotate(60deg)}
    .orbit.three{transform:rotate(-60deg)}
    .electron{position:absolute;width:8px;height:8px;background:#eee;border-radius:50%;top:0;left:calc(50% - 4px);box-shadow:0 0 10px #fff}
    .orbit.one{animation:spin 5s linear infinite}
    .orbit.two{animation:spin 7s linear infinite}
    .orbit.three{animation:spin 9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    a{display:flex;align-items:center;justify-content:center;min-width:150px;height:44px;padding:0 25px;border:1px solid #666;border-radius:3px;color:#fff;background:#171717;text-decoration:none;font:14px Arial,sans-serif}
    a:active{background:#333}
    @media(prefers-reduced-motion:reduce){.orbit{animation:none!important}}
  </style>
</head>
<body>
  <main>
    <div class="atom" aria-hidden="true">
      <div class="nucleus"></div>
      <div class="orbit one"><span class="electron"></span></div>
      <div class="orbit two"><span class="electron"></span></div>
      <div class="orbit three"><span class="electron"></span></div>
    </div>
    <a href="games.html">Games</a>
  </main>
</body>
</html>
