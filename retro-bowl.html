<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { font-family: Arial, sans-serif; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
    #fullscreen {
      position: fixed; z-index: 5; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
      padding: 9px 13px; border: 1px solid #777; border-radius: 3px;
      background: #222; color: #fff; font: 14px Arial, sans-serif; cursor: pointer;
      opacity: .85;
    }
    #fullscreen:active { background: #444; }
    :fullscreen #fullscreen { display: none; }
  </style>
</head>
<body>
  <iframe id="game" src="https://game316009.konggames.com/gamez/0031/6009/live/index.html"
    title="Retro Bowl" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
  <button id="fullscreen" type="button">Fullscreen</button>
  <script>
    const game = document.getElementById('game');
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (game.requestFullscreen) await game.requestFullscreen();
        else if (game.webkitRequestFullscreen) game.webkitRequestFullscreen();
        else window.open('https://game316009.konggames.com/gamez/0031/6009/live/index.html', '_blank', 'noopener');
      } catch (_) {
        window.open('https://game316009.konggames.com/gamez/0031/6009/live/index.html', '_blank', 'noopener');
      }
    });
  </script>
</body>
</html>
