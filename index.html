<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080914">
  <meta name="description" content="AuraGame browser games.">
  <title>AuraGame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .intro-page{justify-content:center;align-items:center}
    .intro-page .ambient{opacity:.12}
    .intro-page .intro{flex:0;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:38px;padding:32px 20px}
    .intro-page .orbit-scene{width:min(390px,78vw);margin:0;justify-self:auto}
    .intro-page .core span{display:none}
    .intro-page .games-button{width:180px;min-height:56px;justify-content:center;margin:0;text-transform:lowercase}
    .intro-page .button-arrow{display:none}
    @media(max-width:760px){.intro-page .intro{gap:34px;padding:24px 20px}.intro-page .orbit-scene{width:min(310px,76vw)}}
  </style>
</head>
<body class="intro-page">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="stars" aria-hidden="true"></div>

  <main class="intro">
    <div class="orbit-scene" aria-hidden="true">
      <div class="orbit orbit-a"></div>
      <div class="orbit orbit-b"></div>
      <div class="orbit orbit-c"></div>
      <div class="core"></div>
      <i class="orbit-point point-a"></i>
      <i class="orbit-point point-b"></i>
      <i class="orbit-point point-c"></i>
    </div>
    <a class="games-button" href="games.html">games</a>
  </main>
  <script src="script.js"></script>
</body>
</html>
